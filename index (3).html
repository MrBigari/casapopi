<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto manca a casa nostra</title>
<meta name="description" content="Il countdown per il giorno in cui andiamo a vivere insieme.">
<meta property="og:title" content="Quanto manca a casa nostra">
<meta property="og:description" content="Il countdown per il giorno in cui andiamo a vivere insieme.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#EDE5D3">

<!-- Icona e "app" sulla schermata Home (file: manifest.webmanifest, icon-*.png, apple-touch-icon.png) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa nostra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">

<style>
  :root {
    --wall: #E4EADF;
    --paper: #F6F7F2;
    --ink: #1E2B2B;
    --ink-soft: #4C5C5A;
    --door: #2F5D62;
    --door-deep: #244A4E;
    --brass: #C79A2B;
    --light: #FFE8A8;
    --light-edge: #FFD166;
    --frame: #1E2B2B;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;

    /* Scena: colori che cambiano con la stagione (default = autunno) */
    --bark: #6B4B3A;
    --line: rgba(58, 46, 42, 0.22);
    --sky-top: #F1D6A2;
    --sky-low: #FBF0D8;
    --sun: #FFE9B3;
    --hill: #C9B574;
    --ground: #A9A056;
    --path: #DCCCA6;
    --roof: #8E4F3A;
    --roof-dark: #703C2C;
    --house: #FBF6EA;
    --bush: #8C8A3A;
    --bush-stroke: transparent;
    --bat: #2B2433;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #16211F;
      --paper: #101A19;
      --ink: #EEF2EA;
      --ink-soft: #AEBBB6;
      --door: #3F7F85;
      --door-deep: #2F6268;
      --frame: #EEF2EA;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }
  body { min-height: 100%; }

  body {
    background: var(--wall);
    color: var(--ink);
    font-family: var(--display);
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 70rem;
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: clamp(1.5rem, 5vw, 4.5rem);
    align-items: center;
  }

  /* ---------- Porta ---------- */
  .door-wrap { display: flex; justify-content: center; }

  .scene { position: relative; width: 100%; max-width: 34rem; }

  .door-svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 12px 26px rgba(30, 43, 43, 0.14));
  }

  @media (prefers-color-scheme: dark) {
    .door-svg { filter: brightness(0.82) drop-shadow(0 12px 26px rgba(0, 0, 0, 0.35)); }
  }

  .door-leaf {
    transform-box: fill-box;
    transform-origin: 0 50%;
    transition: transform 2.2s cubic-bezier(.22, .8, .24, 1);
  }

  .spill {
    transition: opacity 2.2s ease;
    opacity: 0;
  }

  /* ---------- Testo ---------- */
  .who {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }

  .days {
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    flex-wrap: wrap;
    line-height: 0.9;
  }

  .days-num {
    font-size: clamp(6rem, 22vw, 12.5rem);
    font-weight: 800;
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
    font-variation-settings: "opsz" 96;
  }

  .days-label {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 500;
    color: var(--door);
  }

  .clock {
    margin-top: 1.1rem;
    font-size: clamp(1.4rem, 3.6vw, 2rem);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }

  .clock span { color: var(--ink-soft); font-size: 0.7em; margin: 0 0.5em 0 0.15em; }
  .clock span:last-child { margin-right: 0; }

  .when {
    margin-top: 1.4rem;
    font-size: 1.05rem;
    color: var(--ink-soft);
  }

  .when strong { color: var(--ink); font-weight: 500; }

  .note {
    margin-top: 1.8rem;
    padding-top: 1.2rem;
    border-top: 2px solid var(--brass);
    max-width: 30rem;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.3rem;
    line-height: 1.5;
  }

  .note[hidden] { display: none; }

  /* ---------- Tappe ---------- */
  .page { width: 100%; max-width: 70rem; position: relative; z-index: 1; }

  .steps {
    margin-top: clamp(3rem, 8vw, 5.5rem);
    max-width: 36rem;
    margin-left: auto;
    margin-right: auto;
    text-align: left;
  }

  .steps h2 {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 1.4rem;
  }

  .steps ol { list-style: none; position: relative; }

  .steps { --track: color-mix(in srgb, var(--ink) 18%, transparent); }

  /* Connettore che porta dalla tappa alla successiva; --f = quanto è "percorso" (0–1) */
  .step::after {
    content: "";
    position: absolute;
    left: calc(0.65rem - 1px);
    top: 1.45rem;
    width: 2px;
    height: calc(100% - 1.3rem);
    background: linear-gradient(to bottom,
      var(--door) calc(var(--f, 0) * 100%),
      var(--track) calc(var(--f, 0) * 100%));
  }

  .step:last-child::after { display: none; }

  .step {
    position: relative;
    padding: 0 0 1.5rem 2.4rem;
  }

  .step:last-child { padding-bottom: 0; }

  .step::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.15rem;
    width: 1.3rem;
    height: 1.3rem;
    border-radius: 50%;
    background: var(--wall);
    border: 2px solid var(--ink-soft);
    z-index: 1;
  }

  .step-title { font-size: 1.15rem; font-weight: 500; }

  .step-date {
    display: block;
    margin-top: 0.15rem;
    font-size: 0.95rem;
    color: var(--ink-soft);
  }

  .step.done::before { background: var(--door); border-color: var(--door); }
  .step.done .step-title { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 1px; }

  .step.next::before {
    background: var(--brass);
    border-color: var(--brass);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--brass) 28%, transparent);
  }

  .step.next .step-title { font-weight: 800; }

  /* Striscia orizzontale su schermi larghi; su telefono resta in verticale */
  @media (min-width: 721px) {
    .steps { max-width: none; }

    .steps ol {
      display: grid;
      grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr));
    }

    .step::after {
      left: calc(50% + 0.65rem);
      top: calc(0.65rem - 1px);
      width: calc(100% - 1.3rem);
      height: 2px;
      background: linear-gradient(to right,
        var(--door) calc(var(--f, 0) * 100%),
        var(--track) calc(var(--f, 0) * 100%));
    }

    .step { padding: 2.3rem 0.6rem 0; text-align: center; }
    .step:last-child { padding-bottom: 0; }

    .step::before { left: 50%; top: 0; transform: translateX(-50%); }

    .step .step-tag { display: table; margin: 0.5rem auto 0; }
  }

  .step-tag {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 0.05rem 0.55rem;
    border-radius: 99px;
    background: var(--brass);
    color: #1E2B2B;
    font-size: 0.75rem;
    font-weight: 800;
    vertical-align: 0.1em;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Stagioni ---------- */
  body[data-season="autunno"] {
    --wall: #EDE5D3;
    --sky-top: #F1D6A2; --sky-low: #FBF0D8; --sun: #FFE9B3;
    --hill: #C9B574; --ground: #A9A056; --path: #DCCCA6;
    --roof: #8E4F3A; --roof-dark: #703C2C; --house: #FBF6EA;
    --bush: #8C8A3A; --bush-stroke: transparent;
  }
  body[data-season="inverno"] {
    --wall: #E1E9F1;
    --sky-top: #C9DAEA; --sky-low: #EEF4FA; --sun: #FFFFFF;
    --hill: #E9F0F7; --ground: #F7FAFD; --path: #DCE6F0;
    --roof: #6F7F96; --roof-dark: #56657B; --house: #FBF9F4;
    --bush: #FFFFFF; --bush-stroke: #CFDCE8;
  }
  body[data-season="primavera"] {
    --wall: #E7EFDB;
    --sky-top: #BFE2F4; --sky-low: #EAF6FB; --sun: #FFE27A;
    --hill: #A8D28A; --ground: #8CC566; --path: #E5D8B9;
    --roof: #B25A41; --roof-dark: #8F452F; --house: #FFF8EC;
    --bush: #6FA85A; --bush-stroke: transparent;
  }
  body[data-season="estate"] {
    --wall: #F1EBD2;
    --sky-top: #9FD3F0; --sky-low: #DDF0FA; --sun: #FFD84D;
    --hill: #8FBF6A; --ground: #6FAE4E; --path: #E8DBB8;
    --roof: #B25A41; --roof-dark: #8F452F; --house: #FFF6E4;
    --bush: #4E9440; --bush-stroke: transparent;
  }

  /* Elementi della scena */
  .wall  { fill: var(--house); stroke: var(--line); stroke-width: 1.5; }
  .bush  { fill: var(--bush); stroke: var(--bush-stroke); stroke-width: 1; }

  .smoke {
    fill: #fff;
    stroke: #D4DDE6;
    stroke-width: 0.8;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: puff 5.4s ease-out infinite;
  }

  @keyframes puff {
    0%   { opacity: 0;   transform: translate(0, 0) scale(0.6); }
    20%  { opacity: 0.75; }
    100% { opacity: 0;   transform: translate(var(--smx, 12px), -38px) scale(1.7); }
  }

  .bat {
    transform-box: fill-box;
    transform-origin: center;
    animation: flutter 1.8s ease-in-out infinite alternate;
  }

  @keyframes flutter {
    from { transform: translateY(-4px) scaleY(1); }
    to   { transform: translateY(4px) scaleY(0.7); }
  }

  /* Feste: indipendenti dalla stagione, si attivano con una classe sul body (vedi CONFIG.holidays) */
  .deco-halloween, .deco-natale, .deco-carnevale, .deco-pasqua, .deco-liberazione, .deco-lavoratori { display: none; }
  body.halloween .deco-halloween { display: block; }
  body.natale .deco-natale { display: block; }
  body.carnevale .deco-carnevale { display: block; }
  body.pasqua .deco-pasqua { display: block; }
  body.liberazione .deco-liberazione { display: block; }
  body.lavoratori .deco-lavoratori { display: block; }

  /* Compleanno: ha la precedenza su tutto il resto, solo per quel giorno */
  .deco-compleanno { display: none; }
  body.compleanno .deco-compleanno { display: block; }
  body.compleanno .deco-halloween, body.compleanno .deco-natale, body.compleanno .deco-carnevale,
  body.compleanno .deco-pasqua, body.compleanno .deco-liberazione, body.compleanno .deco-lavoratori,
  body.compleanno .deco.pumpkins { display: none; }

  .birthday {
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-weight: 800;
    color: var(--door);
    margin: 0 0 0.7rem;
  }
  .birthday[hidden] { display: none; }

  .flame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flicker 0.5s ease-in-out infinite alternate;
  }

  @keyframes flicker {
    from { transform: scale(1, 1); }
    to   { transform: scale(0.82, 1.18); }
  }

  /* Per il 25 aprile e il 1 maggio i fiori delle fioriere diventano garofani rossi */
  body.liberazione .deco.flowers, body.lavoratori .deco.flowers { display: none; }

  .flag {
    transform-box: fill-box;
    transform-origin: left center;
    animation: flagwave var(--flagp, 2.4s) ease-in-out infinite alternate;
  }

  @keyframes flagwave {
    from { transform: skewY(-4deg) scaleX(1); }
    to   { transform: skewY(4deg) scaleX(0.93); }
  }

  /* Col Natale le zucche di stagione lasciano il posto ai regali */
  body.natale .deco.pumpkins { display: none; }

  .bulb { animation: bulb 1.6s ease-in-out infinite alternate; }

  @keyframes bulb {
    from { opacity: 0.45; }
    to   { opacity: 1; }
  }

  /* ---------- Sorprese al tocco ---------- */
  .door-svg { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .hit rect { fill: transparent; cursor: pointer; }
  .hit:focus { outline: none; }
  .hit:focus-visible rect { stroke: var(--brass); stroke-width: 2; rx: 4; }

  /* Fumo extra quando si tocca il camino (una volta sola, poi sparisce) */
  .smoke.burst { animation: puffBig 3.6s ease-out forwards; }

  @keyframes puffBig {
    0%   { opacity: 0;    transform: translate(0, 0) scale(0.6); }
    18%  { opacity: 0.85; }
    100% { opacity: 0;    transform: translate(var(--bx, 14px), -70px) scale(2.1); }
  }

  /* ---------- Vento sugli alberi ---------- */
  .tree { animation: treesway var(--tp, 4.2s) ease-in-out infinite alternate; }

  @keyframes treesway {
    from { transform: rotate(calc(var(--lean, 0deg) - var(--amp, 0.3deg))); }
    to   { transform: rotate(calc(var(--lean, 0deg) + var(--amp, 0.3deg))); }
  }

  /* ---------- Abitanti: gatto, uccellini, stelle cadenti, lucciole ---------- */
  .cat .cat-sleep, .cat .zzz { display: none; }
  .cat.asleep .cat-eyes { display: none; }
  .cat.asleep .cat-sleep, .cat.asleep .zzz { display: inline; }

  .cat-tail {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    animation: cattail 2.6s ease-in-out infinite alternate;
  }
  @keyframes cattail {
    from { transform: rotate(-8deg); }
    to   { transform: rotate(14deg); }
  }

  .cat-eyes {
    transform-box: fill-box;
    transform-origin: center;
    animation: catblink 5.5s infinite;
  }
  @keyframes catblink {
    0%, 94%, 100% { transform: scaleY(1); }
    97%           { transform: scaleY(0.1); }
  }

  .cat.pet .cat-anim {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: catstretch 0.9s ease-out;
  }
  @keyframes catstretch {
    0%   { transform: scale(1, 1); }
    35%  { transform: scale(1.14, 0.86); }
    70%  { transform: scale(0.94, 1.1); }
    100% { transform: scale(1, 1); }
  }

  .zzz text { animation: zfloat 2.4s ease-in-out infinite alternate; }
  @keyframes zfloat {
    from { opacity: 0.3; transform: translateY(1px); }
    to   { opacity: 1;   transform: translateY(-2px); }
  }

  .heart-pop { animation: heartpop 1.6s ease-out forwards; }
  @keyframes heartpop {
    0%   { opacity: 0; transform: translate(var(--hx), var(--hy)) scale(0.6); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--hx), calc(var(--hy) - 26px)) scale(1.3); }
  }

  .flyer { animation: fly var(--d, 9s) linear forwards; }
  @keyframes fly {
    from { transform: translate(var(--x0), var(--y0)); }
    to   { transform: translate(var(--x1), var(--y1)); }
  }
  .bobber { animation: bob 0.9s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(-3px); }
    to   { transform: translateY(3px); }
  }
  .wing {
    transform-box: fill-box;
    transform-origin: 85% 100%;
    animation: wingflap 0.26s ease-in-out infinite alternate;
  }
  @keyframes wingflap {
    from { transform: scaleY(1); }
    to   { transform: scaleY(-0.65); }
  }

  .meteor { opacity: 0; animation: shoot 1.2s ease-out forwards; }
  @keyframes shoot {
    0%   { opacity: 0; transform: translate(var(--x0), var(--y0)); }
    12%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(var(--x0) + 170px), calc(var(--y0) + 70px)); }
  }

  .ff {
    animation: ffmove var(--m, 8s) ease-in-out infinite alternate, ffblink var(--b, 2.4s) ease-in-out infinite alternate;
  }
  @keyframes ffmove {
    from { transform: translate(0, 0); }
    to   { transform: translate(var(--dx), var(--dy)); }
  }
  @keyframes ffblink {
    from { opacity: 0.05; }
    to   { opacity: 1; }
  }

  /* ---------- Pulsante dei suoni ---------- */
  .sound {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink);
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    -webkit-tap-highlight-color: transparent;
  }
  .sound:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .sound[hidden] { display: none; }
  .sound[aria-pressed="false"] .waves { display: none; }
  .sound[aria-pressed="true"] .slash { display: none; }

  /* ---------- Meteo ---------- */
  .weather { margin-top: 0.5rem; font-size: 1rem; color: var(--ink-soft); }
  .weather[hidden] { display: none; }

  .drop {
    stroke: var(--rain, #CFE0F5);
    stroke-width: 1.3;
    stroke-linecap: round;
    opacity: 0.75;
    animation: raindrop var(--d) linear infinite;
  }

  .flake {
    fill: #fff;
    stroke: #C3D2E1;
    stroke-width: 0.5;
    animation: flakefall var(--d) linear infinite;
  }

  @keyframes raindrop {
    from { transform: translate(var(--x), -24px); }
    to   { transform: translate(calc(var(--x) + var(--dx)), 424px); }
  }

  @keyframes flakefall {
    from { transform: translate(var(--x), -10px); }
    to   { transform: translate(calc(var(--x) + var(--dx)), 410px); }
  }

  .storm #flash { animation: lampo 7s linear infinite; }
  .storm #bolt  { animation: lampo 7s linear infinite; }

  @keyframes lampo {
    0%, 91%, 100% { opacity: 0; }
    92% { opacity: 0.75; }
    93.5% { opacity: 0.1; }
    95% { opacity: 0.6; }
    97% { opacity: 0; }
  }

  /* ---------- Notte ---------- */
  .star { animation: twinkle var(--tw, 3s) ease-in-out infinite alternate; }

  @keyframes twinkle {
    from { opacity: 0.35; }
    to   { opacity: 1; }
  }

  body { transition: background-color 1.5s ease, color 1.5s ease; }

  /* Quando fa notte (ora di Roma) anche la pagina passa al tema scuro */
  body.night {
    --ink: #EEF2EA;
    --ink-soft: #AEBBB6;
    --door: #3F7F85;
    --door-deep: #2F6268;
    --frame: #EEF2EA;
  }
  body.night[data-season="autunno"]   { --wall: #211C15; }
  body.night[data-season="inverno"]   { --wall: #151D27; }
  body.night[data-season="primavera"] { --wall: #17211A; }
  body.night[data-season="estate"]    { --wall: #221F14; }

  @media (prefers-color-scheme: dark) {
    body[data-season="autunno"]   { --wall: #211C15; }
    body[data-season="inverno"]   { --wall: #151D27; }
    body[data-season="primavera"] { --wall: #17211A; }
    body[data-season="estate"]    { --wall: #221F14; }
  }

  .sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .fall {
    position: absolute;
    top: 0;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    opacity: var(--o, 0.75);
    animation: fall var(--d) linear var(--dl) infinite;
    will-change: transform;
  }

  .fall svg {
    display: block;
    width: 100%;
    height: 100%;
    animation: sway var(--sw) ease-in-out var(--dl) infinite alternate;
  }

  .fall.rise { animation: rise var(--d) ease-in-out var(--dl) infinite; }
  .fall.rise svg { filter: drop-shadow(0 0 5px #F4C95D); }

  @keyframes fall {
    from { transform: translate3d(0, -12vh, 0); }
    to   { transform: translate3d(var(--wdx, 0vw), 112vh, 0); }
  }

  @keyframes rise {
    0%   { transform: translate3d(0, 105vh, 0); opacity: 0; }
    15%  { opacity: var(--o, 0.75); }
    85%  { opacity: var(--o, 0.75); }
    100% { transform: translate3d(0, -10vh, 0); opacity: 0; }
  }

  @keyframes sway {
    from { transform: translateX(-16px) rotate(-30deg); }
    to   { transform: translateX(16px) rotate(40deg); }
  }

  /* Decorazioni sulla porta: se ne vede una sola, quella della stagione */

  /* ---------- Stato "ci siamo" ---------- */
  body.arrived .days-label { color: var(--brass); }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; text-align: center; }
    .days { justify-content: center; }
    .note { margin-left: auto; margin-right: auto; }
    .scene { max-width: 26rem; }
  }

  @media (prefers-reduced-motion: reduce) {

    .tree { animation: none; transform: rotate(var(--lean, 0deg)); }
    .cat-tail, .cat-eyes, .zzz text, .ff, .bobber, .wing { animation: none; }
    .storm #flash, .storm #bolt { animation: none; }
    .fall { top: var(--y); }
  }
</style>
</head>

<script>
/* =========================================================
   MODIFICA SOLO QUESTA PARTE
   ========================================================= */
const CONFIG = {
  // Il giorno (e l'ora) in cui avete le chiavi. Formato: AAAA-MM-GGTHH:MM:SS
  target: "2027-05-13T18:00:00",

  // Il giorno in cui avete deciso: serve a far aprire la porta piano piano.
  start: "2026-10-16T00:00:00",

  // Nomi o soprannomi, come preferite.
  names: "Popo & Popa",

  // Il luogo per alba e tramonto. Per ora Roma; quando sapete la città della casa,
  // cambiate le coordinate (latitudine, longitudine). Il fuso orario resta Europe/Rome.
  place: { name: "Roma", lat: 41.9028, lon: 12.4964, tz: "Europe/Rome" },

  // Meteo reale: la pagina legge le condizioni attuali da Open-Meteo (gratuito, senza chiave)
  // e le mostra nella scena. Metti false per spegnerlo.
  // Anteprima senza aspettare il tempo giusto: ?meteo=pioggia (anche pioggerella, temporale,
  // neve, nebbia, nuvoloso, sereno) all'indirizzo.
  weather: true,

  // Suoni d'ambiente (pioggia, vento, camino, grilli, uccelli, tuoni), generati dal telefono:
  // non c'è nessun file audio. Partono solo se qualcuno tocca il pulsante in alto a destra.

  sound: true,
  soundVolume: 0.5,

  // Quando comincia ogni stagione, nel formato "mese-giorno".
  // Ora sono le stagioni "meteorologiche" (l'inverno parte il 1 dicembre).
  // Per quelle astronomiche: primavera "03-20", estate "06-21", autunno "09-23", inverno "12-21".
  seasonStart: { primavera: "03-01", estate: "06-01", autunno: "09-01", inverno: "12-01" },

  // Le feste hanno decorazioni tutte loro, indipendenti dalla stagione.
  // "da" e "a" sono nel formato "mese-giorno"; se "a" viene prima di "da" il periodo
  // attraversa il capodanno (come il Natale, che arriva fino all'Epifania).
  // I compleanni, nel formato "mese-giorno". Nel giorno del compleanno la pagina fa una festa
  // tutta per lui o per lei (e per quel giorno nasconde le altre decorazioni).
  // Lascia date: "" finché non la sai. Anteprima: ?data=2027-02-05 oppure ?compleanno=Popo.
  birthdays: [
    { name: "Popo", date: "02-05" },
    { name: "Popa", date: "05-13" }
  ],

  // Carnevale e Pasqua cambiano data ogni anno: si scrivono rispetto alla Pasqua ("pasqua-47" =
  // 47 giorni prima della Pasqua, cioè il Martedì Grasso; "pasqua+1" = Pasquetta).
  holidays: {
    halloween: { from: "10-01",    to: "11-02",    emoji: "🎃" },
    natale:    { from: "12-08",    to: "01-06",    emoji: "🎄" },
    carnevale: { from: "pasqua-54", to: "pasqua-47", emoji: "🎭" },   // una settimana fino al Martedì Grasso
    pasqua:    { from: "pasqua-7",  to: "pasqua+1",  emoji: "🐣" },   // dalla Domenica delle Palme a Pasquetta
    liberazione: { from: "04-23",   to: "04-25",    emoji: "🕊️" },   // 25 aprile, Festa della Liberazione
    lavoratori:  { from: "04-29",   to: "05-01",    emoji: "🛠️" }    // 1 maggio, Festa dei lavoratori
  },

  // La frase in fondo. Lasciala vuota ("") finché non l'avete scelta: in quel caso non viene mostrata.
  message: "",

  // Le tappe, in ordine. La data è facoltativa: quando la sapete, scrivetela
  // nel formato "2027-03-20" (oppure "2027-03-20T15:00:00" se volete anche l'ora).
  // Una tappa con data passata risulta fatta da sola; per segnarne una a mano
  // senza data, aggiungete done: true.
  // Se la data è approssimativa, aggiungete label: "inizio novembre": la pagina
  // mostra quella scritta invece della data. In quel caso scegliete come date

  steps: [
    { title: "Sopralluogo Luigi e Zio Daniele", date: "2026-11-10", label: "inizio novembre" },
    { title: "Sopralluogo Popi e prime pulizie", date: "2026-12-20", label: "metà dicembre" },
    { title: "Acquisto del letto", date: "2027-03-31", label: "fine marzo" },
    { title: "Ultime pulizie", date: "2027-05-01" },
    { title: "Prima notte", date: "target" }   // "target" = la data del countdown
  ],

  // Cosa mostrare quando il momento è arrivato.
  arrivedTitle: "Siamo a casa.",
  arrivedMessage: "Il countdown è finito. Adesso comincia tutto il resto.",

  // Se il giorno dell'arrivo è anche un compleanno ({nome} diventa il nome di chi festeggia).
  arrivedBirthdayMessage: "Buon compleanno, {nome}. E benvenuti a casa."

/* ========================================================= */

const $ = id => document.getElementById(id);
const target = new Date(CONFIG.target);
const start = new Date(CONFIG.start);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let BDAY = [];   // chi fa il compleanno oggi (impostato da initSeason)

const pad = n => String(n).padStart(2, "0");
const plural = (n, one, many) => (n === 1 ? one : many);

function countWeekends(from, to) {
  // Conta i sabati tra due date.
  let count = 0;
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  while (d < to) {
    if (d.getDay() === 6 && d >= new Date(from.getFullYear(), from.getMonth(), from.getDate())) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

function setDoor(progress) {
  const p = Math.min(1, Math.max(0, progress));
  const open = 0.07 + 0.93 * p;             // parte già un po' socchiusa
  const scale = 1 - 0.82 * open;            // l'anta si "chiude" verso il cardine = si apre
  $("leaf").style.transform = "scaleX(" + scale.toFixed(3) + ")";
  $("spill").style.opacity = (0.15 + 0.85 * p).toFixed(2);
}

function renderSteps() {
  const list = $("steps");
  const steps = CONFIG.steps || [];
  $("stepsSection").hidden = steps.length === 0;
  if (!steps.length) return;

  const now = new Date();
  const allDone = now >= target;
  const fmt = new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long" });

  const items = steps.map(step => {
    const when = step.date ? (step.date === "target" ? target : new Date(step.date)) : null;
    return { step, when, done: allDone || step.done === true || !!(when && when <= now) };
  });

  let nextFound = false;
  list.innerHTML = "";
  list.style.setProperty("--n", steps.length);

  items.forEach(({ step, when, done }, i) => {
    const li = document.createElement("li");
    li.className = "step";

    // Quanto è piena la linea che porta alla tappa successiva (0–1).
    let fill = 0;
    const nxt = items[i + 1];
    if (done && nxt) {
      if (nxt.done) fill = 1;
      else if (when && nxt.when) fill = Math.min(1, Math.max(0, (now - when) / (nxt.when - when)));
    }
    li.style.setProperty("--f", fill.toFixed(3));

    const title = document.createElement("span");
    title.className = "step-title";
    title.textContent = step.title;
    li.appendChild(title);

    if (done) {
      li.classList.add("done");
    } else if (!nextFound) {
      nextFound = true;
      li.classList.add("next");
      const tag = document.createElement("span");
      tag.className = "step-tag";
      tag.textContent = "prossima";
      title.appendChild(tag);
    }

    const sub = document.createElement("span");
    sub.className = "step-date";
    if (step.label) {
      sub.textContent = step.label;
    } else if (when) {
      const days = Math.ceil((when - now) / 86400000);
      sub.textContent = fmt.format(when) + (!done && days > 0 ? " · tra " + days + " " + plural(days, "giorno", "giorni") : "");
    } else {
      sub.textContent = "data da definire";
    }
    li.appendChild(sub);

    list.appendChild(li);
  });
}

function render() {
  const now = new Date();
  const diff = target - now;

  if (diff <= 0) {
    document.body.classList.add("arrived");
    const since = Math.floor((now - target) / 86400000);
    $("days").textContent = since;
    $("daysLabel").textContent = plural(since, "giorno a casa", "giorni a casa");
    $("clock").style.display = "none";
    $("when").innerHTML = "<strong>" + CONFIG.arrivedTitle + "</strong>";
    const msg = (BDAY.length && CONFIG.arrivedBirthdayMessage)
      ? CONFIG.arrivedBirthdayMessage.replace("{nome}", BDAY.join(" e "))
      : CONFIG.arrivedMessage;
    $("note").textContent = msg;
    $("note").hidden = !msg;
    $("srText").textContent = CONFIG.arrivedTitle;
    document.title = "Siamo a casa 🔑";
    setDoor(1);
    return false;
  }

  const totalSec = Math.floor(diff / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;

  $("days").textContent = d;
  $("daysLabel").textContent = plural(d, "giorno", "giorni");
  $("h").textContent = pad(h);
  $("m").textContent = pad(m);
  $("s").textContent = pad(s);

  document.title = d + " " + plural(d, "giorno", "giorni") + " a casa nostra";

  if (s === 0 || !$("srText").textContent) {
    $("srText").textContent = "Mancano " + d + " " + plural(d, "giorno", "giorni") +
      ", " + h + " ore e " + m + " minuti.";
  }
  return true;
}

/* ---------- Stagioni ---------- */
const SEASONS = {
  autunno:   { label: "autunno",   emoji: "🍂", kind: "leaf",  count: 14, colors: ["#C8553D", "#D98E2B", "#A8452E", "#B98A2E", "#8C6A2A"] },
  inverno:   { label: "inverno",   emoji: "❄️", kind: "snow",  count: 22, colors: ["#FFFFFF"] },
  primavera: { label: "primavera", emoji: "🌷", kind: "petal", count: 14, colors: ["#F4B6C8", "#F9D3DC", "#E8C9F0", "#FFFFFF"] },
  estate:    { label: "estate",    emoji: "☀️", kind: "glow",  count: 12, colors: ["#F4C95D", "#F9DE8C"] }
};

// "mese-giorno" -> numero confrontabile (es. "12-08" -> 1208)
const mdKey = s => { const p = s.split("-").map(Number); return p[0] * 100 + p[1]; };

// Data di oggi a Roma. Anteprima: ?data=2026-12-20 all'indirizzo.
function romeToday() {
  const real = zoned(new Date(), CONFIG.place.tz);
  const dp = new URLSearchParams(location.search).get("data");
  if (dp && /^\d{4}-\d{2}-\d{2}$/.test(dp)) {
    const a = dp.split("-").map(Number);
    return { y: a[0], m: a[1], d: a[2], min: real.min };
  }
  return real;
}

// La stagione è quella con l'inizio più recente (CONFIG.seasonStart).
function seasonFor(t) {
  const cur = t.m * 100 + t.d;
  const list = Object.keys(CONFIG.seasonStart)
    .map(k => [k, mdKey(CONFIG.seasonStart[k])])
    .sort((a, b) => a[1] - b[1]);
  let pick = list[list.length - 1][0];          // prima del primo inizio dell'anno: è ancora l'ultima stagione
  list.forEach(e => { if (e[1] <= cur) pick = e[0]; });
  return pick;
}

// Data della Pasqua (calendario gregoriano) per l'anno dato.
function easterDate(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return { m: Math.floor((h + l - 7 * m + 114) / 31), d: ((h + l - 7 * m + 114) % 31) + 1 };
}

// "10-01" oppure "pasqua-47" / "pasqua+1" -> numero mese*100+giorno per quell'anno.
function holidayKey(spec, y) {
  const m = /^pasqua([+-]\d+)?$/.exec(spec);
  if (!m) return mdKey(spec);
  const e = easterDate(y);
  const dt = new Date(Date.UTC(y, e.m - 1, e.d + (m[1] ? parseInt(m[1], 10) : 0)));
  return (dt.getUTCMonth() + 1) * 100 + dt.getUTCDate();
}

// Chi fa il compleanno oggi (CONFIG.birthdays). Anteprima: ?compleanno=Popo
function birthdaysToday(t) {
  const cur = t.m * 100 + t.d;
  const forced = new URLSearchParams(location.search).get("compleanno");
  return (CONFIG.birthdays || []).filter(b =>
    forced ? forced.toLowerCase() === b.name.toLowerCase() : (b.date && mdKey(b.date) === cur)
  ).map(b => b.name);
}

// Le feste attive oggi (CONFIG.holidays). Anteprima: ?festa=natale (o ?festa=nessuna).
function activeHolidays(t) {
  const cur = t.m * 100 + t.d;
  const forced = new URLSearchParams(location.search).get("festa");
  return Object.keys(CONFIG.holidays).filter(k => {
    if (forced) return forced === k;
    const h = CONFIG.holidays[k], from = holidayKey(h.from, t.y), to = holidayKey(h.to, t.y);
    return from <= to ? (cur >= from && cur <= to) : (cur >= from || cur <= to);
  });
}

function shape(kind, c) {
  switch (kind) {
    case "leaf":
      return '<svg viewBox="0 0 24 24"><path d="M12 2C19 7 19 15 12 22C5 15 5 7 12 2Z" fill="' + c + '"/>' +
             '<path d="M12 22V8" stroke="rgba(0,0,0,.25)" stroke-width="1" fill="none"/></svg>';
    case "snow":
      return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff" stroke="#B9CADB" stroke-width="1.5"/></svg>';
    case "petal":
      return '<svg viewBox="0 0 24 24"><path d="M12 2C21 6 21 17 12 22C3 17 3 6 12 2Z" fill="' + c + '"/></svg>';
    default:
      return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="' + c + '"/></svg>';
  }
}

/* ---------- Scena: alberi e prato ---------- */
// Generatore casuale con seme: gli alberi hanno sempre la stessa forma,
// cambiano solo le foglie da una stagione all'altra.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const TREE = {
  autunno:   { tip: 0.95, per: 4, mid: 0.7, midPer: 2, rmin: 3,   rmax: 6.5, colors: ["#E8B93C", "#D98E2B", "#C8553D", "#F1D06B", "#B98A2E"] },
  inverno:   { tip: 0.45, per: 1, mid: 0,   midPer: 0, rmin: 1.6, rmax: 3,   colors: ["#FFFFFF"], stroke: "#C3D2E1" },
  primavera: { tip: 1,    per: 4, mid: 0.6, midPer: 2, rmin: 2.5, rmax: 5,   colors: ["#F4B6C8", "#F9D3DC", "#FFFFFF", "#9CC27A"] },
  estate:    { tip: 1,    per: 6, mid: 0.9, midPer: 4, rmin: 5,   rmax: 9,   colors: ["#4E9440", "#5FA84C", "#3F8236", "#6DB35A"] }
};

function drawTree(x, y, h, seed, key) {
  const r = mulberry32(seed);
  const T = TREE[key];
  let wood = "", foliage = "";

  const leaf = (px, py) => {
    const rad = T.rmin + r() * (T.rmax - T.rmin);
    const c = T.colors[Math.floor(r() * T.colors.length)];
    foliage += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + rad.toFixed(1) +
      '" fill="' + c + '"' + (T.stroke ? ' stroke="' + T.stroke + '" stroke-width=".8"' : "") + "/>";
  };

  function branch(x1, y1, ang, len, w, depth) {
    const x2 = x1 + Math.sin(ang) * len;
    const y2 = y1 - Math.cos(ang) * len;
    wood += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) +
      '" y2="' + y2.toFixed(1) + '" stroke-width="' + w.toFixed(1) + '"/>';

    if (depth > 1 && r() < T.mid) {
      for (let k = 0; k < T.midPer; k++) {
        leaf(x1 + (x2 - x1) * r() + (r() - 0.5) * 8, y1 + (y2 - y1) * r() + (r() - 0.5) * 8);
      }
    }
    if (depth === 0) {
      if (r() < T.tip) {
        for (let k = 0; k < T.per; k++) leaf(x2 + (r() - 0.5) * 14, y2 + (r() - 0.5) * 14);
      }
      return;
    }
    const n = depth >= 3 ? 2 : (r() < 0.35 ? 3 : 2);
    for (let i = 0; i < n; i++) {
      const spread = (i - (n - 1) / 2) * 0.62 + (r() - 0.5) * 0.3;
      branch(x2, y2, ang + spread, len * (0.7 + r() * 0.1), Math.max(w * 0.68, 0.9), depth - 1);
    }
  }

  branch(x, y, (r() - 0.5) * 0.12, h * 0.34, h * 0.048, 4);
  // Il gruppo "tree" oscilla col vento, ruotando attorno alla base del tronco.
  return '<g class="tree" style="transform-origin:' + x + "px " + y + "px;animation-delay:-" + (seed % 5) +
    's"><g stroke="var(--bark)" stroke-linecap="round" fill="none">' + wood + "</g>" + foliage + "</g>";
}

function groundDetails(key) {
  const r = mulberry32(99);
  let out = "";
  if (key === "autunno") {
    const cols = ["#C8553D", "#D98E2B", "#E8B93C", "#A8452E", "#B98A2E"];
    for (let i = 0; i < 22; i++) {
      const cx = 14 + r() * 452, cy = 346 + r() * 48;
      out += '<ellipse cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" rx="' + (3 + r() * 2.5).toFixed(1) +
        '" ry="' + (1.5 + r()).toFixed(1) + '" fill="' + cols[i % cols.length] +
        '" transform="rotate(' + Math.floor(r() * 180) + " " + cx.toFixed(1) + " " + cy.toFixed(1) + ')"/>';
    }

/* ---------- Suoni d'ambiente (sintetizzati dal telefono con Web Audio, nessun file audio) ---------- */
function createSoundEngine(ctx) {
  const rnd = Math.random;
  const master = ctx.createGain();
  master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor();
  master.connect(comp);
  comp.connect(ctx.destination);

  // Due secondi di rumore, riutilizzati da pioggia, vento, fuoco e tuono.
  const len = Math.floor(ctx.sampleRate * 2);
  const noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;

  const gain = (v, to) => { const g = ctx.createGain(); g.gain.value = v; if (to) g.connect(to); return g; };
  const filt = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; };
  const loopNoise = () => { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(); return s; };

  // Pioggia: rumore senza i toni più bassi e più alti.
  const rainG = gain(0, master);
  const rainHp = filt("highpass", 700), rainLp = filt("lowpass", 7000);
  loopNoise().connect(rainHp); rainHp.connect(rainLp); rainLp.connect(rainG);

  // Vento: rumore grave che si apre e si chiude lentamente, con folate.
  const windG = gain(0, master);
  const windMod = gain(0.75, windG);
  const windLp = filt("lowpass", 420, 0.7);
  loopNoise().connect(windLp); windLp.connect(windMod);
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.17;
  const lfoG = gain(260); lfo.connect(lfoG); lfoG.connect(windLp.frequency); lfo.start();
  const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.41;
  const lfo2G = gain(0.25); lfo2.connect(lfo2G); lfo2G.connect(windMod.gain); lfo2.start();

  // Camino: fiamma di fondo (rumore molto grave) più scoppiettii casuali.
  const fireG = gain(0, master);
  const fireBed = filt("lowpass", 220);
  loopNoise().connect(fireBed); fireBed.connect(gain(0.16, fireG));

  // Uccelli e grilli.
  const birdsG = gain(0, master);
  const cricketG = gain(0, master);
  const crickets = [3900, 4450, 5050].map(f => {
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
    const g = gain(0, cricketG); o.connect(g); o.start();
    return { g: g, next: 0 };
  });

  const fireState = { next: 0 }, birdState = { next: 0 };

  function crackle(t, big) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const bp = filt("bandpass", 1200 + rnd() * 4500, 1.2);
    const g = gain(0, fireG);
    s.connect(bp); bp.connect(g);
    const dur = big ? 0.03 + rnd() * 0.05 : 0.004 + rnd() * 0.02;
    const a = big ? 0.7 + rnd() * 0.3 : 0.15 + rnd() * 0.4;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(a, t + 0.0015);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.start(t, rnd() * 1.5, dur + 0.02);
  }

  function chirp(v, t) {
    for (let i = 0; i < 3; i++) {
      const tt = t + i * 0.085;
      v.g.gain.setValueAtTime(0, tt);
      v.g.gain.linearRampToValueAtTime(0.14, tt + 0.008);
      v.g.gain.linearRampToValueAtTime(0, tt + 0.034);
    }
  }

  function tweet(t, base) {
    const n = 2 + Math.floor(rnd() * 3);
    let tt = t;
    for (let i = 0; i < n; i++) {
      const o = ctx.createOscillator(); o.type = "sine";
      const g = gain(0, birdsG);
      const f0 = base * (0.9 + rnd() * 0.3), f1 = f0 * (1.15 + rnd() * 0.5), d = 0.05 + rnd() * 0.06;
      o.frequency.setValueAtTime(f0, tt);
      o.frequency.exponentialRampToValueAtTime(f1, tt + d);
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.linearRampToValueAtTime(0.25, tt + d * 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + d);
      o.connect(g); o.start(tt); o.stop(tt + d + 0.02);
      tt += d + 0.06 + rnd() * 0.05;
    }
  }

  function thunder(t) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const lp = filt("lowpass", 140 + rnd() * 80);
    const g = gain(0, master);
    s.connect(lp); lp.connect(g);
    const dur = 3 + rnd() * 2.5;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(2.6, t + 0.25);
    g.gain.linearRampToValueAtTime(1.0, t + 0.9);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.start(t); s.stop(t + dur + 0.1);
  }

  // Miagolio: un tono "ruvido" che sale e scende, filtrato come una voce.
  function meow(t) {
    const o = ctx.createOscillator(); o.type = "sawtooth";
    const bp = filt("bandpass", 800, 3);
    const g = gain(0, master);
    o.connect(bp); bp.connect(g);
    o.frequency.setValueAtTime(420, t);
    o.frequency.linearRampToValueAtTime(720, t + 0.18);
    o.frequency.linearRampToValueAtTime(380, t + 0.55);
    bp.frequency.setValueAtTime(800, t);
    bp.frequency.linearRampToValueAtTime(1500, t + 0.2);
    bp.frequency.linearRampToValueAtTime(700, t + 0.55);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.06);
    g.gain.linearRampToValueAtTime(0.35, t + 0.3);
    g.gain.linearRampToValueAtTime(0, t + 0.6);
    o.start(t); o.stop(t + 0.65);
  }

  // L = { rain, wind, fire, crickets, birds } con valori 0–1.
  function setLevels(L, vol) {
    const now = ctx.currentTime, tc = 1.2;
    rainG.gain.setTargetAtTime(0.18 * L.rain, now, tc);
    windG.gain.setTargetAtTime(0.8 * L.wind, now, tc);
    fireG.gain.setTargetAtTime(1.2 * L.fire, now, tc);
    cricketG.gain.setTargetAtTime(1.4 * L.crickets, now, tc);
    birdsG.gain.setTargetAtTime(1.2 * L.birds, now, tc);
    master.gain.setTargetAtTime(vol, now, 0.5);
  }

  // Programma i suoni "a eventi" (scoppiettii, canti) per l'intervallo [from, to] secondi.
  function schedule(from, to, L) {
    if (L.fire > 0.03) {
      if (fireState.next < from) fireState.next = from;
      while (fireState.next < to) {
        crackle(fireState.next, rnd() < 0.08);
        fireState.next += 0.03 + Math.pow(rnd(), 2) * 0.45;
      }
    }
    if (L.crickets > 0.03) {
      crickets.forEach((v, i) => {
        if (v.next < from) v.next = from + rnd() * 0.6;
        while (v.next < to) { chirp(v, v.next); v.next += 1.1 + rnd() * 0.9 + i * 0.15; }
      });
    }
    if (L.birds > 0.03) {
      if (birdState.next < from) birdState.next = from + rnd();
      while (birdState.next < to) {
        tweet(birdState.next, 2400 + rnd() * 1800);
        birdState.next += 1.3 + rnd() * 4.5;
      }
    }
  }

  return { ctx: ctx, master: master, setLevels: setLevels, schedule: schedule, thunder: thunder, meow: meow };
}

// Cosa far sentire adesso, in base a meteo, stagione e ora (valori 0–1).
function soundLevels() {
  const season = document.body.dataset.season;
  const k = DARK, t = TIME.t;
  const temp = WX.has && typeof WX.temp === "number" ? WX.temp : null;
  const windV = WX.has ? WX.wind : 0;
  const rain = WX.snow ? 0 : Math.min(1, WX.rain * 1.15);
  const wind = Math.min(1, smooth((windV - 4) / 40) + (WX.storm ? 0.25 : 0));
  const calm = (1 - rain) * (1 - smooth((windV - 12) / 18));
  const cold = temp != null ? smooth((17 - temp) / 9) : (season === "autunno" || season === "inverno" ? 0.6 : 0);
  const warm = temp != null ? smooth((temp - 11) / 8) : (season === "estate" ? 1 : season === "inverno" ? 0 : 0.5);
  const crickets = smooth((k - 0.4) / 0.4) * warm * calm;
  const morning = smooth((t - (TIME.rise - 30)) / 30) * (1 - smooth((t - (TIME.rise + 150)) / 120));
  const evening = smooth((t - (TIME.set - 150)) / 40) * (1 - smooth((t - TIME.set) / 40));
  const day = smooth((LIGHT - 0.25) / 0.5);
  const birds = day * calm * Math.min(1, 0.25 + 0.75 * morning + 0.5 * evening) * (season === "inverno" ? 0.4 : 1);
  return { rain: rain, wind: wind, fire: cold, crickets: crickets, birds: birds };
}

let AUDIO = null, STARTING = false;

function updateSound() {
  if (AUDIO) AUDIO.engine.setLevels(soundLevels(), CONFIG.soundVolume);
}

function soundTick() {
  const a = AUDIO;
  if (!a) return;
  const now = a.ctx.currentTime;
  a.engine.schedule(Math.max(a.until, now), now + 2.5, soundLevels());
  a.until = now + 2.5;
}

function setSoundButton(on) {
  const b = $("soundBtn");
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.setAttribute("aria-label", on ? "Spegni i suoni d'ambiente" : "Attiva i suoni d'ambiente");
  b.title = on ? "Suoni d'ambiente: accesi" : "Suoni d'ambiente: spenti";
}

async function startSound() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || STARTING || AUDIO) return;
  STARTING = true;
  try {
    const ctx = new AC();
    try { await ctx.resume(); } catch (e) { /* alcuni browser riprendono da soli */ }
    AUDIO = { ctx: ctx, engine: createSoundEngine(ctx), until: ctx.currentTime, timer: setInterval(soundTick, 1000) };
    updateSound();
    soundTick();
    setSoundButton(true);
  } catch (e) {
    AUDIO = null;
  }
  STARTING = false;
}

function stopSound() {
  const a = AUDIO;
  AUDIO = null;
  setSoundButton(false);
  if (!a) return;
  clearInterval(a.timer);
  a.engine.master.gain.setTargetAtTime(0, a.ctx.currentTime, 0.2);
  setTimeout(() => { a.ctx.close().catch(() => {}); }, 900);
}

function initSound() {
  const btn = $("soundBtn");
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!CONFIG.sound || !AC) { btn.hidden = true; return; }

  btn.addEventListener("click", () => { if (AUDIO) stopSound(); else startSound(); });

  // Il tuono segue il lampo: arriva qualche istante dopo, come nella realtà.
  const onFlash = () => {
    const a = AUDIO;
    if (!a || !WX.storm || reduceMotion) return;
    setTimeout(() => { if (AUDIO === a && WX.storm) a.engine.thunder(a.ctx.currentTime + 0.05); },
      (6.4 + 0.8 + Math.random() * 1.8) * 1000);
  };
  $("flash").addEventListener("animationstart", onFlash);
  $("flash").addEventListener("animationiteration", onFlash);

  // Se la pagina va in secondo piano il suono si ferma, e riprende quando si torna.
  document.addEventListener("visibilitychange", () => {
    const a = AUDIO;
    if (!a) return;
    if (document.hidden) a.ctx.suspend(); else a.ctx.resume();
  });
}

function buildFireflies() {

    out += '<g transform="translate(' + (24 + r() * 432).toFixed(0) + " " + (300 + r() * 92).toFixed(0) + ')">' +
      '<g class="ff" style="--dx:' + ((r() - 0.5) * 40).toFixed(0) + "px;--dy:" + ((r() - 0.5) * 24).toFixed(0) +
      "px;--m:" + (6 + r() * 6).toFixed(1) + "s;--b:" + (1.6 + r() * 2).toFixed(1) + "s;animation-delay:-" + (r() * 8).toFixed(1) + 's">' +
      '<circle r="5" fill="#E6FF7A" opacity=".22"/><circle r="1.7" fill="#F4FFB0"/></g></g>';
  }
  $("fireflies").innerHTML = out;
}

// Aggiorna ciò che dipende da ora e meteo: il gatto dorme di notte, le lucciole escono d'estate al buio.
function updateCreatures() {
  $("cat").classList.toggle("asleep", DARK > 0.6);
  const warmNight = document.body.dataset.season === "estate";
  const calm = (1 - Math.min(1, WX.rain * 1.5)) * (1 - smooth(((WX.has ? WX.wind : 0) - 15) / 15));
  $("fireflies").setAttribute("opacity", (warmNight ? smooth((DARK - 0.45) / 0.3) * calm : 0).toFixed(2));
}

function initCreatures() {
  buildFireflies();
  scheduleBirds(true);
  const activate = (el, fn) => {
    el.addEventListener("click", fn);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } });
  };

/* ---------- Effetti del meteo: vento, vetri appannati, arcobaleno ---------- */
function applyWeatherFx() {
  const svg = document.querySelector(".door-svg");
  const sdir = windScreenDir();
  const v = WX.wind, g = Math.max(WX.gust, v);

  // Alberi: si inclinano da una parte (vento medio) e oscillano (raffiche).
  const trees = $("trees");
  trees.style.setProperty("--lean", (sdir * Math.min(8, v / 5.5)).toFixed(2) + "deg");
  trees.style.setProperty("--amp", Math.min(4, 0.3 + g / 22).toFixed(2) + "deg");
  trees.style.setProperty("--tp", Math.max(1.4, 4.2 - v / 14).toFixed(2) + "s");

  // Fumo che si piega, bandiera più o meno agitata, foglie e petali portati dal vento.
  svg.style.setProperty("--smx", (WX.has ? sdir * Math.min(40, 6 + v * 0.7) : 12).toFixed(0) + "px");
  svg.style.setProperty("--flagp", Math.max(0.7, 2.6 - v / 18).toFixed(2) + "s");
  $("sky").style.setProperty("--wdx", (WX.has ? sdir * Math.min(30, v * 0.9) : 0).toFixed(1) + "vw");

  // Vetri: si appannano sotto i 12° e arrivano al massimo a 2°; sotto zero c'è la brina.
  const temp = WX.has && typeof WX.temp === "number" ? WX.temp : 20;
  $("windowFog").setAttribute("opacity", smooth((12 - temp) / 10).toFixed(2));
  $("frost").setAttribute("opacity", smooth((2 - temp) / 4).toFixed(2));

  // Arcobaleno: ha piovuto da poco, il sole è basso e fa capolino tra le nuvole.
  let bow = 0;
  if (WX.has && WX.recentRain >= 0.3 && LIGHT > 0.5) {
    bow = Math.min(1, WX.recentRain / 1.5) *
      (1 - smooth((WX.cover - 0.2) / 0.45)) *
      smooth((SUNALT - 2) / 6) * (1 - smooth((SUNALT - 34) / 8));
  }
  const rb = $("rainbow");
  rb.setAttribute("opacity", (0.6 * bow).toFixed(2));
  rb.setAttribute("transform", "translate(" + Math.max(130, Math.min(350, 480 - SUNX)).toFixed(0) + " 0)");
}

/* ---------- Meteo reale (Open-Meteo) ---------- */
// Codici meteo WMO -> descrizione e intensità degli effetti (0–1).
const WMO = {
  0: { l: "sereno" }, 1: { l: "quasi sereno" }, 2: { l: "poco nuvoloso" }, 3: { l: "coperto" },
  45: { l: "nebbia", fog: 0.85 }, 48: { l: "nebbia con brina", fog: 0.85 },
  51: { l: "pioggerella leggera", rain: 0.25 }, 53: { l: "pioggerella", rain: 0.35 }, 55: { l: "pioggerella intensa", rain: 0.5 },
  56: { l: "pioggerella gelata", rain: 0.35 }, 57: { l: "pioggerella gelata", rain: 0.5 },
  61: { l: "pioggia leggera", rain: 0.45 }, 63: { l: "pioggia", rain: 0.7 }, 65: { l: "pioggia forte", rain: 1 },
  66: { l: "pioggia gelata", rain: 0.7 }, 67: { l: "pioggia gelata forte", rain: 0.9 },
  71: { l: "neve debole", snow: 0.4 }, 73: { l: "neve", snow: 0.7 }, 75: { l: "neve forte", snow: 1 }, 77: { l: "nevischio", snow: 0.3 },
  80: { l: "rovesci deboli", rain: 0.5 }, 81: { l: "rovesci", rain: 0.8 }, 82: { l: "rovesci forti", rain: 1 },
  85: { l: "rovesci di neve", snow: 0.6 }, 86: { l: "rovesci di neve forti", snow: 0.9 },
  95: { l: "temporale", rain: 0.8, storm: true }, 96: { l: "temporale con grandine", rain: 1, storm: true },
  99: { l: "temporale forte con grandine", rain: 1, storm: true }
};

// Per l'anteprima con ?meteo=...
const MOCK_WX = {
  sereno:      { weather_code: 0,  cloud_cover: 0,   temperature_2m: 18, wind_speed_10m: 6 },
  nuvoloso:    { weather_code: 3,  cloud_cover: 100, temperature_2m: 14, wind_speed_10m: 10 },
  pioggerella: { weather_code: 53, cloud_cover: 90,  temperature_2m: 12, wind_speed_10m: 8 },
  pioggia:     { weather_code: 63, cloud_cover: 100, temperature_2m: 11, wind_speed_10m: 14 },
  temporale:   { weather_code: 95, cloud_cover: 100, temperature_2m: 16, wind_speed_10m: 30 },
  neve:        { weather_code: 73, cloud_cover: 100, temperature_2m: -1, wind_speed_10m: 8 },
  nebbia:      { weather_code: 45, cloud_cover: 100, temperature_2m: 7,  wind_speed_10m: 3 },
  vento:       { weather_code: 2,  cloud_cover: 40,  temperature_2m: 15, wind_speed_10m: 40, wind_gusts_10m: 65, wind_direction_10m: 270 },
  freddo:      { weather_code: 3,  cloud_cover: 90,  temperature_2m: 4,  wind_speed_10m: 6 },
  gelo:        { weather_code: 0,  cloud_cover: 10,  temperature_2m: -3, wind_speed_10m: 4 },
  arcobaleno:  { weather_code: 2,  cloud_cover: 30,  temperature_2m: 14, wind_speed_10m: 8, recent_rain: 2 }   // con ?ora=17:30
};

let WX = { has: false, cover: 0, fog: 0, rain: 0, snow: 0, storm: false, wind: 0, gust: 0, dir: null, label: "", temp: null, recentRain: 0 };
let TIME = { t: 720, rise: 420, set: 1080 };   // ora (minuti da mezzanotte), alba e tramonto di oggi
let SUNALT = 0, SUNX = 240, LIGHT = 1;   // altezza del sole, posizione nel cielo, luce (aggiornati da applyDaylight)
let wxSig = "";

function setWeather(cur, recent) {
  const info = WMO[cur.weather_code] || { l: "" };
  let cover = typeof cur.cloud_cover === "number" ? cur.cloud_cover / 100 : 0;
  if (info.rain || info.snow || info.storm) cover = Math.max(cover, 0.85);
  if (info.fog) cover = Math.max(cover, 0.7);
  WX = {
    cover: Math.min(1, cover), fog: info.fog || 0, rain: info.rain || 0, snow: info.snow || 0,
    storm: !!info.storm, wind: cur.wind_speed_10m || 0, label: info.l, temp: cur.temperature_2m,
    has: true, gust: cur.wind_gusts_10m || 0,
    dir: typeof cur.wind_direction_10m === "number" ? cur.wind_direction_10m : null,
    recentRain: typeof recent === "number" ? recent : (cur.recent_rain || 0)
  };
  renderWeather();
  applyDaylight();
}

// Da che parte spinge il vento sullo schermo: -1 = verso sinistra, +1 = verso destra.
// La scena guarda a sud (il sole va da sinistra a destra, quindi l'est è a sinistra):
// un vento da ovest (270°) spinge verso est, cioè verso sinistra.
function windScreenDir() {
  return Math.sin((WX.dir == null ? 270 : WX.dir) * Math.PI / 180);
}

function renderWeather() {
  const svg = document.querySelector(".door-svg");
  svg.classList.toggle("storm", WX.storm);

  // Le particelle si ridisegnano solo se cambiano intensità o vento.
  const sdir = windScreenDir();
  const sig = [WX.rain.toFixed(2), WX.snow.toFixed(2), Math.round(WX.wind / 10), Math.round(sdir * 10)].join("|");
  if (sig !== wxSig) {
    wxSig = sig;
    const r = mulberry32(31);
    const dx = sdir * Math.min(120, WX.wind * 3.2);      // il vento inclina la pioggia: negativo = verso sinistra
    let drops = "", flakes = "";

    const nDrops = Math.round(WX.rain * 110);
    for (let i = 0; i < nDrops; i++) {
      const len = 9 + r() * 7;
      const x = (dx < 0 ? 0 : -dx) + r() * (480 + Math.abs(dx));
      const d = (0.55 + r() * 0.35) * (1.25 - 0.4 * WX.rain);
      drops += '<line class="drop" x1="0" y1="0" x2="' + (dx / 424 * len).toFixed(2) + '" y2="' + len.toFixed(1) +
        '" style="--x:' + x.toFixed(1) + "px;--y:" + (r() * 400).toFixed(0) + "px;--dx:" + dx.toFixed(0) +
        "px;--d:" + d.toFixed(2) + "s;animation-delay:-" + (r() * d).toFixed(2) + 's"/>';
    }

    const nFlakes = Math.round(WX.snow * 90);
    for (let i = 0; i < nFlakes; i++) {
      const d = 6 + r() * 5;
      flakes += '<circle class="flake" r="' + (1.4 + r() * 1.6).toFixed(1) +
        '" style="--x:' + (r() * 480).toFixed(1) + "px;--y:" + (r() * 400).toFixed(0) + "px;--dx:" +
        (((r() - 0.5) * 50) + dx * 0.3).toFixed(0) + "px;--d:" + d.toFixed(1) +
        "s;animation-delay:-" + (r() * d).toFixed(1) + 's"/>';
    }
    $("rain").innerHTML = drops;
    $("snowfall").innerHTML = flakes;
  }

  // Riga di testo con temperatura e condizioni.
  const night = document.body.classList.contains("night");
  const emo = WX.storm ? "⛈️" : WX.snow ? "❄️" : WX.rain ? "🌧️" : WX.fog ? "🌫️" :
    WX.cover > 0.6 ? "☁️" : WX.cover > 0.25 ? "⛅" : (night ? "🌙" : "☀️");
  if (WX.label && typeof WX.temp === "number") {
    $("weather").textContent = emo + " " + CONFIG.place.name + ", adesso: " + Math.round(WX.temp) + "° · " + WX.label;
    $("weather").hidden = false;
  }
}

// Quanta pioggia (mm) è caduta nelle ultime ore, dalle righe orarie fino a "adesso".
function recentRain(h, now) {
  if (!h || !h.time || !h.precipitation) return 0;
  let sum = 0;
  h.time.forEach((t, i) => { if (t <= now) sum += h.precipitation[i] || 0; });
  return sum;
}

async function loadWeather() {
  const mock = new URLSearchParams(location.search).get("meteo");
  if (mock && MOCK_WX[mock]) { setWeather(MOCK_WX[mock]); return; }
  if (!CONFIG.weather) return;
  try {
    const P = CONFIG.place;
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + P.lat + "&longitude=" + P.lon +
      "&current=temperature_2m,weather_code,cloud_cover,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m" +
      "&hourly=precipitation&past_hours=3&forecast_hours=1&timezone=" + encodeURIComponent(P.tz);
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 8000);
    const res = await fetch(url, { signal: ctl.signal });
    clearTimeout(to);
    if (!res.ok) return;
    const j = await res.json();
    if (j && j.current) setWeather(j.current, recentRain(j.hourly, j.current.time));
  } catch (e) {
    // Senza connessione o se il servizio non risponde, la scena resta com'era.
  }
}

/* ---------- Giorno e notte (ora di Roma) ---------- */
const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

function hex2rgb(h) {
  h = h.trim().replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}

// Data e ora (in minuti dalla mezzanotte) nel fuso orario scelto.
function zoned(date, tz) {
  const p = {};
  new Intl.DateTimeFormat("en-CA", {
    timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
  }).formatToParts(date).forEach(x => { p[x.type] = x.value; });
  return { y: +p.year, m: +p.month, d: +p.day, min: +p.hour * 60 + +p.minute + +p.second / 60 };
}

// Alba e tramonto calcolati dalla posizione del Sole (nessun servizio esterno).
// alt = altezza del Sole sull'orizzonte: -0.833 per alba/tramonto, -6 per il crepuscolo civile.
// Il risultato è in minuti dalla mezzanotte, nell'ora locale del luogo (quindi con ora legale).
function sunEvent(y, m, d, alt) {
  const P = CONFIG.place, rad = Math.PI / 180;
  const jd = Date.UTC(y, m - 1, d, 12) / 86400000 + 2440587.5;
  const n = Math.round(jd - 2451545.0 + 0.0008);
  const Js = n - P.lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const lam = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lam * rad);
  const sinD = Math.sin(lam * rad) * Math.sin(23.4397 * rad);
  const cosD = Math.cos(Math.asin(sinD));
  const cosW = (Math.sin(alt * rad) - Math.sin(P.lat * rad) * sinD) / (Math.cos(P.lat * rad) * cosD);
  const w = Math.acos(Math.max(-1, Math.min(1, cosW))) / rad;
  const toMin = J => zoned(new Date((J - 2440587.5) * 86400000), P.tz).min;
  return { rise: toMin(Jt - w / 360), set: toMin(Jt + w / 360), noon: toMin(Jt), sinD: sinD, cosD: cosD };
}

// Fase lunare (0 = nuova, 0.5 = piena) e forma della parte illuminata.
function moonPhase(date) {
  const syn = 29.530588853;
  const jd = date.getTime() / 86400000 + 2440587.5;
  return ((((jd - 2451550.1) % syn) + syn) % syn) / syn;
}

function moonLitPath(r, ph) {
  const k = Math.cos(2 * Math.PI * ph);
  const rx = (Math.abs(k) * r).toFixed(2);
  return "M0 " + (-r) + "A" + r + " " + r + " 0 0 1 0 " + r +
         "A" + rx + " " + r + " 0 0 " + (k > 0 ? 0 : 1) + " 0 " + (-r) + "Z";
}

function starsHtml() {
  const r = mulberry32(5);
  let out = "";
  for (let i = 0; i < 48; i++) {
    out += '<circle class="star" cx="' + (8 + r() * 464).toFixed(1) + '" cy="' + (10 + r() * 220).toFixed(1) +
      '" r="' + (0.8 + r()).toFixed(1) + '" fill="#fff" style="--tw:' + (2 + r() * 3).toFixed(1) +
      "s;animation-delay:-" + (r() * 4).toFixed(1) + 's"/>';
  }
  return out;
}

function applyDaylight() {
  const P = CONFIG.place;
  const real = romeToday();
  let t = real.min;

  // Anteprima: aggiungi ?ora=22:30 all'indirizzo per vedere la scena a quell'ora (ora di Roma).
  const ora = new URLSearchParams(location.search).get("ora");
  if (ora && /^\d{1,2}:\d{2}$/.test(ora)) {
    const hm = ora.split(":").map(Number);
    t = hm[0] * 60 + hm[1];
  }

  const ev = sunEvent(real.y, real.m, real.d, -0.833);
  const tw = sunEvent(real.y, real.m, real.d, -6);
  const rise = ev.rise, set = ev.set, dawn = tw.rise, dusk = tw.set;

  // Quanta luce c'è (0 = notte piena, 1 = giorno pieno).
  // Al mattino sale dal crepuscolo fino a poco dopo l'alba; la sera scende da poco prima
  // del tramonto fino al crepuscolo. Al momento esatto di alba/tramonto è ancora luminoso.
  const m0 = dawn - 10, m1 = rise + 25, e0 = set - 25, e1 = dusk + 10;
  let light;
  if (t <= m0 || t >= e1) light = 0;
  else if (t < m1) light = smooth((t - m0) / (m1 - m0));
  else if (t <= e0) light = 1;
  else light = smooth((e1 - t) / (e1 - e0));

  const k = 1 - light;                                   // buio
  const w = Math.min(1, Math.exp(-Math.pow((t - rise) / 40, 2)) +
                        Math.exp(-Math.pow((t - set) / 40, 2)));   // luce calda di alba/tramonto

  const svg = document.querySelector(".door-svg");
  const css = getComputedStyle(document.body);
  const skyTop = css.getPropertyValue("--sky-top").trim();
  const skyLow = css.getPropertyValue("--sky-low").trim();
  const sunCol = css.getPropertyValue("--sun").trim();

  if (/^#/.test(skyTop) && /^#/.test(skyLow)) {
    let top = mix(skyTop, "#0A1430", k);
    top = mix(top, "#6C5B8F", 0.25 * w);
    let low = mix(skyLow, "#25396B", k);
    low = mix(low, "#F7A96B", 0.55 * w * (1 - 0.6 * k));
    const f = 0.75 * WX.cover;
    top = mix(top, mix(WX.storm ? "#5A6370" : "#9AA6B4", "#0F1624", k), f);
    low = mix(low, mix(WX.storm ? "#8A929C" : "#C9D0D8", "#2A3248", k), f);
    $("skyTop").setAttribute("stop-color", top);
    $("skyLow").setAttribute("stop-color", low);
  }

  // Il paesaggio si scurisce e vira al blu; all'alba e al tramonto prende una luce calda.
  const r = 1 - 0.60 * k + 0.08 * w, g = 1 - 0.50 * k, b = 1 - 0.28 * k - 0.14 * w;
  $("nightM").setAttribute("values",
    [r, 0, 0, 0, 0, 0, g, 0, 0, 0, 0, 0, b, 0, 0, 0, 0, 0, 1, 0].map(v => +v.toFixed(3)).join(" "));

  $("stars").style.opacity = (Math.max(0, (k - 0.4) / 0.6) * (1 - 0.95 * WX.cover)).toFixed(2);
  $("clouds").setAttribute("opacity", (0.65 * light + 0.12 * k).toFixed(2));
  $("horizonGlow").setAttribute("opacity", (0.6 * w * (1 - 0.35 * k) * (1 - 0.85 * WX.cover)).toFixed(2));

  // Meteo: nuvole in più (più scure col brutto tempo), nebbia, colore della pioggia.
  const cm = $("cloudsMore");
  cm.setAttribute("opacity", (WX.cover * (0.75 * light + 0.16 * k)).toFixed(2));
  cm.setAttribute("fill", mix("#FFFFFF", "#6F7885", WX.storm ? 0.6 : (WX.rain || WX.snow) ? 0.35 : 0));
  $("fog").setAttribute("opacity", WX.fog.toFixed(2));
  ["fog0", "fog1", "fog2"].forEach(id => $(id).setAttribute("stop-color", mix("#E8EEF2", "#1B2742", k)));

  // Sole: sorge a est, tramonta a ovest, passando dietro alle colline.
  const p = (t - rise) / (set - rise);
  const sunUp = t > rise - 12 && t < set + 12;
  $("sun").setAttribute("transform",
    "translate(" + (60 + 360 * p).toFixed(1) + " " + (292 - 250 * Math.sin(Math.PI * p)).toFixed(1) + ")");
  $("sun").style.opacity = sunUp ? (1 - 0.85 * WX.cover).toFixed(2) : 0;
  if (/^#/.test(sunCol)) $("sunDisc").setAttribute("fill", mix(sunCol, "#FF8A3D", 0.65 * w));

  // Luna: sorge al tramonto e tramonta all'alba, con la fase del giorno.
  const nightLen = 1440 - (set - rise);
  let q = -1;
  if (t >= set) q = (t - set) / nightLen;
  else if (t < rise) q = (t - set + 1440) / nightLen;
  const moon = $("moon");
  if (q >= 0 && q <= 1) {
    const ph = moonPhase(new Date(Date.UTC(real.y, real.m - 1, real.d, 12)));
    moon.setAttribute("transform",
      "translate(" + (60 + 360 * q).toFixed(1) + " " + (292 - 240 * Math.sin(Math.PI * q)).toFixed(1) + ")");
    $("moonLit").setAttribute("d", moonLitPath(14, ph));
    $("moonLit").setAttribute("transform", ph >= 0.5 ? "scale(-1 1)" : "");
    moon.style.opacity = (Math.min(1, k * 1.6) * (1 - 0.75 * WX.cover)).toFixed(2);
  } else {
    moon.style.opacity = 0;
  }

  // Finestre e porta: più luminose quando fa buio.
  const glow = smooth(k * 1.4);
  $("halos").setAttribute("opacity", (0.7 * glow).toFixed(2));
  $("spillNight").setAttribute("opacity", (0.6 * glow).toFixed(2));

  svg.style.setProperty("--bat", mix("#2B2433", "#A79BD0", k));
  svg.style.setProperty("--rain", mix("#CFE0F5", "#7F97BE", k));

  DARK = k;
  paintWindows();

  // Altezza del sole sull'orizzonte (gradi): serve all'arcobaleno.
  const rad = Math.PI / 180;
  const H = (t - ev.noon) * 0.25;
  SUNALT = Math.asin(Math.sin(P.lat * rad) * ev.sinD + Math.cos(P.lat * rad) * ev.cosD * Math.cos(H * rad)) / rad;
  SUNX = 60 + 360 * p;
  LIGHT = light;
  TIME = { t: t, rise: rise, set: set };
  applyWeatherFx();
  updateSound();
  updateCreatures();
  document.body.classList.toggle("night", k > 0.5);

  // Il colore della barra del telefono segue lo sfondo (stagione e notte).
  const wall = getComputedStyle(document.body).getPropertyValue("--wall").trim();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && /^#/.test(wall)) meta.setAttribute("content", wall);
}

function init() {
  $("who").textContent = CONFIG.names;
  initSeason();
  applyDaylight();
  initTouch();
  initSound();
  initCreatures();
  $("note").textContent = CONFIG.message;
  $("note").hidden = !CONFIG.message;

  const dateText = new Intl.DateTimeFormat("it-IT", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  }).format(target);

  const weekends = countWeekends(new Date(), target);
  $("when").innerHTML =
    "Fino a <strong>" + dateText + "</strong>. " +
    (weekends > 0
      ? "Prima delle chiavi: " + weekends + " " + plural(weekends, "weekend", "weekend") + "."
      : "");

  renderSteps();
  const running = render();

  // La porta parte chiusa e si apre una volta sola, all'arrivo.
  const progress = (new Date() - start) / (target - start);
  if (reduceMotion) {
    setDoor(progress);
  } else {
    $("leaf").style.transform = "scaleX(1)";
    requestAnimationFrame(() => requestAnimationFrame(() => setDoor(progress)));
  }

  setInterval(applyDaylight, 60000);

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  if (running) {
    setInterval(() => {
      if (!render()) return;
      // Aggiorna la porta ogni minuto, senza strappi.
      if (new Date().getSeconds() === 0) {
        setDoor((new Date() - start) / (target - start));
        renderSteps();
      }
    }, 1000);
  }
}

init();
</script>
</body>
</html>
